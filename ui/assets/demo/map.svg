<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif} .muted{fill:#a2a3b7}</style><rect width="800" height="580" fill="#edf3f4"/><text x="50" y="65" fill="#768f96" font-size="25">一点点，连成自己的小世界。</text><path d="M114 352Q234 104 389 269T715 208" fill="none" stroke="#bacbd0" stroke-width="2" stroke-dasharray="7 10"/><g fill="#fff" stroke="#d9e4e7"><rect x="85" y="291" width="110" height="100" rx="20"/><rect x="318" y="218" width="142" height="100" rx="20"/><rect x="602" y="188" width="116" height="100" rx="20"/></g><g text-anchor="middle" font-size="18" fill="#93a5ad"><text x="140" y="346">发现</text><text x="389" y="273">留住</text><text x="660" y="243">串联</text></g><text x="270" y="161" fill="#b2bfd1" font-size="48">✧</text><text x="537" y="397" fill="#c1adb8" font-size="46">✿</text><text x="51" y="500" fill="#a6b5b8" font-size="15">收藏不是终点。它让下一次灵感，更容易开始。</text><text x="780" y="564" text-anchor="end" font-size="10" fill="#a4a0b6">AgentBloom 演示插画</text></svg>