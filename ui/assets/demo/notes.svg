<svg xmlns="http://www.w3.org/2000/svg" width="660" height="780" viewBox="0 0 660 780"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif} .muted{fill:#a2a3b7}</style><rect width="660" height="780" fill="#f6f0e4"/><rect x="40" y="33" width="580" height="704" rx="5" fill="#fffdf8"/><rect x="225" y="20" width="210" height="30" rx="4" fill="#d5c6b1" opacity=".55" transform="rotate(-3 330 35)"/><text x="90" y="120" fill="#a08a76" font-size="30">片刻，也值得被记住。</text><text x="91" y="165" fill="#c3b4a5" font-size="15">Notes for a lovely little collection</text><g font-size="19" fill="#a39789"><text x="92" y="247">✿　错落，但要看得清。</text><text x="92" y="318">✧　保留图片原本的比例。</text><text x="92" y="389">♡　让功能先回应，再让角色点头。</text><text x="92" y="460">✿　给重要的片刻留一点空白。</text></g><path d="M91 535h470m-470 49h420m-420 49h455" stroke="#eee7dd" stroke-width="2"/><circle cx="489" cy="632" r="33" fill="#e2d8e5"/><text x="489" y="647" text-anchor="middle" fill="#aa94b5" font-size="43">✿</text><text x="640" y="764" text-anchor="end" font-size="10" fill="#a4a0b6">AgentBloom 演示插画</text></svg>