<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif} .muted{fill:#a2a3b7}</style><rect width="760" height="660" fill="#252a3d"/><rect width="760" height="49" fill="#30364b"/><circle cx="28" cy="25" r="5" fill="#c28f9f"/><circle cx="47" cy="25" r="5" fill="#d0b684"/><circle cx="66" cy="25" r="5" fill="#91b3a0"/><text x="100" y="30" fill="#9b9fb3" font-size="13">collections.ts</text><g font-size="18"><text x="35" y="100" fill="#6d758e">01</text><text x="80" y="100" fill="#aba3d8">// A little home for every screenshot.</text><text x="35" y="147" fill="#6d758e">02</text><text x="80" y="147" fill="#c0a1ce">async function <tspan fill="#a6c2d3">collect</tspan><tspan fill="#d4d4df">(moment) {</tspan></text><text x="35" y="194" fill="#6d758e">03</text><text x="110" y="194" fill="#c0a1ce">const <tspan fill="#d4d4df">project = currentProject();</tspan></text><text x="35" y="241" fill="#6d758e">04</text><text x="110" y="241" fill="#c0a1ce">const <tspan fill="#d4d4df">copy = </tspan><tspan fill="#c0a1ce">await </tspan><tspan fill="#a6c2d3">keep</tspan><tspan fill="#d4d4df">(moment);</tspan></text><text x="35" y="288" fill="#6d758e">05</text><text x="110" y="288" fill="#d4d4df">project.<tspan fill="#a6c2d3">add</tspan>(copy);</text><text x="35" y="335" fill="#6d758e">06</text><text x="110" y="335" fill="#c0a1ce">return <tspan fill="#a6c2d3">aSmallDiscovery</tspan><tspan fill="#d4d4df">(copy);</tspan></text><text x="35" y="382" fill="#6d758e">07</text><text x="80" y="382" fill="#d4d4df">}</text></g><path d="M80 426h590" stroke="#3b425c"/><text x="80" y="477" fill="#a6b6a9" font-size="18">✓  Every image belongs somewhere.</text><text x="80" y="521" fill="#959eb7" font-size="15">Keep the original. Save a copy.</text><text x="80" y="555" fill="#959eb7" font-size="15">Little details, thoughtfully remembered.</text><text x="740" y="644" text-anchor="end" font-size="10" fill="#a4a0b6">Agen